<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Distillery">
  <defs>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.26"/>
    </filter>

    <linearGradient id="cap" x1="48" y1="10" x2="80" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="glass" x1="28" y1="20" x2="98" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#e2e8f0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0.40"/>
    </linearGradient>

    <linearGradient id="liquid" x1="30" y1="68" x2="98" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="shine" x1="44" y1="36" x2="38" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <rect x="50" y="12" width="28" height="22" rx="10" fill="url(#cap)" stroke="#0f172a" stroke-width="4"/>
    <path d="M58 30 V54 L30 96 C24 106 32 118 45 118 H83 C96 118 104 106 98 96 L70 54 V30 Z"
          fill="url(#glass)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Liquid -->
    <path d="M36 98 L54 66 H74 L92 98 C95 104 92 110 84 110 H44 C36 110 33 104 36 98 Z"
          fill="url(#liquid)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Bubbles -->
    <circle cx="56" cy="86" r="4" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="70" cy="92" r="3.5" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="64" cy="78" r="3" fill="#ffffff" fill-opacity="0.14"/>

    <!-- Glass shine -->
    <path d="M48 40 C46 54 44 64 38 80" fill="none" stroke="url(#shine)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
