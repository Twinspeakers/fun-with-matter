<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="HP">
  <defs>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.26"/>
    </filter>

    <linearGradient id="heart" x1="26" y1="18" x2="106" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a7a"/>
      <stop offset="0.45" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#7f1026"/>
    </linearGradient>

    <linearGradient id="heartInner" x1="34" y1="30" x2="92" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulse" x1="36" y1="68" x2="92" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <path d="M64 114 C64 114 24 88 24 52 C24 34 37 22 54 22 C63 22 70 26 74.5 33.5
             C79 26 86 22 95 22 C112 22 125 34 125 52 C125 88 64 114 64 114 Z"
          fill="url(#heart)" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>

    <!-- Gloss -->
    <path d="M44 42 C48 30 66 26 78 34 C66 34 58 40 54 48 C52 53 47 54 44 50 Z" fill="url(#heartInner)"/>

    <!-- Tiny pulse line -->
    <path d="M38 72 H52 L58 62 L66 84 L74 66 L78 72 H90"
          fill="none" stroke="url(#pulse)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M38 72 H52 L58 62 L66 84 L74 66 L78 72 H90"
          fill="none" stroke="#0f172a" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
