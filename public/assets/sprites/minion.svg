<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffcf66" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ff6a00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb000"/>
      <stop offset="100%" stop-color="#ff3300"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="1 0 0 0 0
                0 0.6 0 0 0
                0 0 0.2 0 0
                0 0 0 0.9 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- heat haze glow -->
  <circle cx="256" cy="230" r="180" fill="url(#glow)"/>

  <!-- minion -->
  <g filter="url(#softShadow)">
    <!-- body -->
    <path d="M180 365
             C165 325, 170 285, 190 250
             C210 214, 240 190, 256 188
             C272 190, 302 214, 322 250
             C342 285, 347 325, 332 365
             C316 405, 286 430, 256 432
             C226 430, 196 405, 180 365Z"
          fill="url(#skin)"/>

    <!-- shoulders/arms (ready stance) -->
    <path d="M150 315
             C135 300, 134 276, 152 262
             C170 248, 195 260, 202 278
             C210 298, 195 322, 175 328
             C165 331, 156 322, 150 315Z"
          fill="url(#skin)"/>
    <path d="M362 315
             C377 300, 378 276, 360 262
             C342 248, 317 260, 310 278
             C302 298, 317 322, 337 328
             C347 331, 356 322, 362 315Z"
          fill="url(#skin)"/>

    <!-- hands/claws -->
    <path d="M142 325 C130 332, 124 350, 134 362 C146 376, 170 366, 172 350 C174 336, 156 320, 142 325Z"
          fill="#0d0d0d"/>
    <path d="M370 325 C382 332, 388 350, 378 362 C366 376, 342 366, 340 350 C338 336, 356 320, 370 325Z"
          fill="#0d0d0d"/>

    <!-- head -->
    <path d="M202 190
             C205 150, 230 122, 256 120
             C282 122, 307 150, 310 190
             C313 235, 292 270, 256 272
             C220 270, 199 235, 202 190Z"
          fill="url(#skin)" filter="url(#hotGlow)"/>

    <!-- eyes -->
    <ellipse cx="232" cy="198" rx="20" ry="14" fill="#080808"/>
    <ellipse cx="280" cy="198" rx="20" ry="14" fill="#080808"/>
    <ellipse cx="232" cy="198" rx="12" ry="8" fill="url(#ember)" opacity="0.95"/>
    <ellipse cx="280" cy="198" rx="12" ry="8" fill="url(#ember)" opacity="0.95"/>

    <!-- mouth -->
    <path d="M226 232 C240 248, 272 248, 286 232" stroke="#0b0b0b" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- cracks / embers -->
    <path d="M256 130 C246 156, 250 182, 238 206"
          stroke="url(#ember)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M276 148 C292 174, 292 200, 304 222"
          stroke="url(#ember)" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M230 305 C246 316, 266 316, 282 302"
          stroke="url(#ember)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <circle cx="210" cy="336" r="3" fill="#ff7a00" opacity="0.9"/>
    <circle cx="304" cy="354" r="2.5" fill="#ff3b00" opacity="0.85"/>
    <circle cx="262" cy="328" r="2.2" fill="#ffb000" opacity="0.8"/>
  </g>
</svg>
